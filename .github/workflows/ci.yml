name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    # Attend que les invariants de sécurité passent avant de construire —
    # voir docs/regle-migrations.md. Ça ne suffit PAS à bloquer un déploiement
    # Vercel à lui seul (Vercel se déclenche sur le push lui-même, pas sur le
    # résultat de ce workflow) : la vraie protection vient de la branch
    # protection GitHub sur `main` (voir le même document), qui empêche tout
    # commit non vérifié d'atteindre `main` — et donc de déclencher Vercel —
    # en premier lieu. Cette dépendance sert à ce que le statut global de la
    # CI reflète honnêtement l'échec, pas à elle seule à empêcher un déploiement.
    needs: security-invariants

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bloquant : la dette ESLint pré-existante (react-hooks/set-state-in-effect,
      # react/no-unescaped-entities...) a été résorbée — `react/no-unescaped-entities`
      # rescopée dans eslint.config.mjs (apostrophes françaises, sans risque
      # de rendu réel) et les violations react-hooks/* corrigées au cas par
      # cas (dérivation via useMemo quand c'était sûr, useRef pour les
      # instances MediaRecorder mutées impérativement, eslint-disable-next-line
      # justifié ligne par ligne pour les patterns légitimes que ces règles
      # expérimentales — conçues pour le React Compiler, non utilisé ici —
      # signalent en faux positif (localStorage/window en SSR, reset de state
      # asynchrone...). `npm run lint` passe à 0 erreur.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Valeurs factices : NEXT_PUBLIC_SUPABASE_URL et
          # NEXT_PUBLIC_SUPABASE_ANON_KEY sont validées au chargement du
          # module (src/lib/env.js) et font échouer le build si absentes,
          # mais ne sont jamais réellement appelées pendant `next build`
          # (aucune page ne fait de fetch Supabase au moment du build) — de
          # simples valeurs syntaxiquement plausibles suffisent en CI.
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          # NEXT_PUBLIC_SENTRY_DSN volontairement absent ici : le SDK Sentry
          # (src/instrumentation-client.js, sentry.server/edge.config.js)
          # retombe sur une chaîne vide et se désactive silencieusement sans
          # faire échouer le build — testé localement sans cette variable.

  db-lint:
    name: Supabase DB Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      # Démarre un stack Postgres local (Docker, déjà présent sur les
      # runners ubuntu-latest) et applique TOUTES les migrations de
      # supabase/migrations/ depuis zéro — c'est ce qui permet de linter le
      # schéma réel plutôt que le texte SQL brut, sans toucher au projet
      # distant ni nécessiter de secret (SUPABASE_ACCESS_TOKEN) en CI.
      - name: Start local Supabase stack (applique les migrations)
        run: supabase start

      # plpgsql_check (fonctions instables, erreurs de syntaxe/sémantique,
      # search_path manquant...). Testé au préalable contre le projet lié en
      # conditions réelles (`supabase db lint --linked`) : zéro résultat
      # actuellement, donc bloquant (--fail-on warning) dès le premier run —
      # contrairement au lint ESLint plus haut, il n'y a pas de dette connue
      # à absorber avant d'activer la porte.
      #
      # Ne détecte PAS les policies RLS trop permissives (ex. le bucket
      # storage "resumes" corrigé plus tôt) : ça reste du ressort du Security
      # Advisor de Supabase (API Management /advisors/security), un outil
      # distinct non couvert par cette étape.
      - name: Lint database schema
        run: supabase db lint --local --level warning --fail-on warning

  security-invariants:
    name: Invariants de sécurité
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Les 7 invariants (tests/security/invariants.spec.js, voir
      # docs/invariants-securite.md) n'utilisent jamais de page/navigateur —
      # ils interrogent la base réelle (CLI Supabase) et lisent le dépôt sur
      # disque. Chromium reste installé par prudence (comportement interne
      # du fixture-loading de Playwright non garanti entre versions), coût
      # négligeable comparé au risque d'un échec de setup non lié aux
      # invariants eux-mêmes.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # SUPABASE_DB_URL doit être configuré comme secret GitHub Actions
      # (Settings → Secrets and variables → Actions) — chaîne de connexion
      # directe (Dashboard Supabase → Project Settings → Database →
      # Connection string, variante "Session pooler" recommandée pour un
      # runner éphémère). Sans ce secret, ce job échoue explicitement au
      # lieu de tourner à vide sur une base vide/absente — un job vert qui
      # n'a rien vérifié serait pire qu'un rouge honnête.
      - name: Vérifier que SUPABASE_DB_URL est configuré
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL n'est pas configuré (Settings → Secrets and variables → Actions). Les invariants 1-4 et 7 ne peuvent pas interroger la base réelle sans lui — voir docs/invariants-securite.md."
            exit 1
          fi

      - name: Exécuter les 7 invariants de sécurité
        run: npx playwright test tests/security/invariants.spec.js --project=chromium
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          CI: true

      - name: Publier le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: invariants-playwright-report
          path: playwright-report/
          retention-days: 14
