<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facilité — Profil — Langues</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
  body{margin:0;background:#3a3a3a;font-family:'Roboto',system-ui,sans-serif;display:flex;justify-content:center;padding:40px 16px;box-sizing:border-box}
  .note{position:fixed;top:12px;left:12px;color:#fff;font-size:12px;opacity:.6;max-width:280px}
  .phone{width:412px;min-height:892px;background:#F2F0EA;border-radius:36px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
  .screen{height:100%;display:flex;flex-direction:column;color:#1A1A1A;box-sizing:border-box;position:relative;overflow:auto}
</style>
</head>
<body>
<div class="note">Référence statique — {{ }} = valeur dynamique, sc-for/sc-if = listes et états gérés par l'app (voir README).</div>
<div class="phone"><div class="screen">
    <div onClick="{{ closeAdminSection }}" style="display:flex;align-items:center;gap:10px;padding:16px 20px;font-size:16px;font-weight:800;cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Informations personnelles
    </div>
    <div style="margin:0 20px 14px;border-top:1px solid rgba(0,0,0,0.08)"></div>
    <div style="margin:0 20px;display:flex;flex-direction:column;gap:14px;padding-bottom:24px">
      <sc-for list="{{ infoPersoRows }}" as="r" hint-placeholder-count="6">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div style="width:36px;height:36px;border-radius:18px;background:#eef1fb;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">{{ r.icon }}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:10.5px;color:rgba(0,0,0,0.4)">{{ r.label }}</div>
            <div style="font-size:14px;font-weight:700;color:{{ r.valueColor }};margin-top:2px">{{ r.value }}</div>
            <div style="font-size:11.5px;color:rgba(0,0,0,0.4);margin-top:2px">{{ r.sub }}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <sc-if value="{{ r.badge }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:10.5px;font-weight:600;color:{{ r.badgeColor }};background:{{ r.badgeBg }};padding:3px 8px;border-radius:100px">{{ r.badge }}</span>
            </sc-if>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 20L5 16L16 5L19 8L8 19L4 20Z" stroke="rgba(0,0,0,0.4)" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </sc-for>
    </div>
</div></div>
</body>
</html>
