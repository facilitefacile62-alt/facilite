<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facilité — Fonctionnalités (liste des outils)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
  body{margin:0;background:#3a3a3a;font-family:'Roboto',system-ui,sans-serif;display:flex;justify-content:center;padding:40px 16px;box-sizing:border-box}
  .note{position:fixed;top:12px;left:12px;color:#fff;font-size:12px;opacity:.6;max-width:280px}
  .phone{width:412px;min-height:892px;background:#0B0D10;border-radius:36px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
  .screen{height:100%;display:flex;flex-direction:column;background:#0B0D10;color:#F5F6F7;box-sizing:border-box;position:relative}
</style>
</head>
<body>
<div class="note">Référence statique — {{ }} = valeur dynamique, sc-for/sc-if = listes et états gérés par l'app (voir README).</div>
<div class="phone"><div class="screen">
<div data-screen-label="Fonctionnalités" style="flex:1;position:relative;display:flex;flex-direction:column;background:#F2F0EA;color:#1A1A1A;overflow:hidden">
  <div style="flex-shrink:0;background:#fff;border-bottom:1px solid rgba(0,0,0,0.06);padding:14px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:12px;background:#F2F0EA;display:flex;align-items:center;justify-content:center;font-size:17px">🛠️</div>
        <div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:16px;font-weight:800">Fonctionnalités</span>
            <span style="font-size:10px;font-weight:700;color:#44403C;background:#E7E5E4;padding:3px 8px;border-radius:100px">OUTILS ACTIFS</span>
          </div>
        </div>
      </div>
      <div onClick="{{ goHome }}" style="display:flex;align-items:center;gap:6px;background:#F2F0EA;border-radius:100px;padding:9px 14px;cursor:pointer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V20H14V14H10V20H4V11Z" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span style="font-size:12.5px;font-weight:700">Accueil</span>
      </div>
    </div>
  </div>
  <div style="flex-shrink:0;background:#fff;padding:0 16px 14px">
    <div style="display:flex;gap:4px;background:#F2F0EA;border-radius:100px;padding:4px">
      <div onClick="{{ selectOutilsAll }}" style="{{ outilsTabAllStyle }};flex:1;text-align:center">Tous les outils</div>
      <div onClick="{{ selectOutilsPdf }}" style="{{ outilsTabPdfStyle }};flex:1;text-align:center">Outils PDF &amp; Documents</div>
      <div onClick="{{ selectOutilsIa }}" style="{{ outilsTabIaStyle }};flex:1;text-align:center">Outils IA &amp; Carrière</div>
    </div>
  </div>
  <div style="flex:1;overflow:auto;padding:14px 16px 24px;position:relative">
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ outilsList }}" as="o" hint-placeholder-count="9">
        <div style="{{ o.rowStyle }}">
          <div style="width:40px;height:40px;border-radius:12px;background:{{ o.bg }};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">{{ o.icon }}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:700;color:#1A1A1A">{{ o.title }}</div>
            <div style="font-size:12px;color:rgba(0,0,0,0.45);margin-top:2px">{{ o.sub }}</div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="rgba(0,0,0,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="position:absolute;right:16px;bottom:16px;width:52px;height:52px;border-radius:26px;background:linear-gradient(135deg,#10B981,#0ea975);box-shadow:0 6px 16px rgba(16,185,129,0.4);display:flex;align-items:center;justify-content:center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#fff" stroke-width="1.8"/><path d="M6 11V12C6 15.3 8.7 18 12 18C15.3 18 18 15.3 18 12V11" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="18" x2="12" y2="21" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
  </div>
</div>
</div></div>
</body>
</html>
